<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Be Water · 授权群组参与控制台</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="offline-banner" id="offlineBanner" hidden>SSE 连接已断开，后台任务可能仍在运行，正在重连…</div>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">BW</div>
        <div><strong>BE WATER</strong><span>授权群组参与</span></div>
      </div>
      <div class="runtime-pill"><span class="status-dot idle" id="statusDot"></span><span id="statusText">未运行</span></div>
      <nav class="nav-list" aria-label="主导航">
        <button class="nav-item active" data-view="overview"><span>▦</span>概览</button>
        <button class="nav-item" data-view="groups"><span>◉</span>授权群组</button>
        <button class="nav-item" data-view="strategy"><span>⌁</span>参与策略</button>
        <button class="nav-item" data-view="generator"><span>✦</span>AI 与 TXT</button>
        <button class="nav-item" data-view="activity"><span>▤</span>实时动态</button>
        <button class="nav-item" data-view="audit"><span>⚑</span>安全与审计</button>
        <button class="nav-item" data-view="system"><span>⚙</span>系统设置</button>
      </nav>
      <div class="sidebar-controls">
        <button class="button primary full" id="btnStart">开始自动参与</button>
        <div class="control-row">
          <button class="button secondary" id="btnPause" hidden>暂停</button>
          <button class="button secondary" id="btnResume" hidden>恢复</button>
          <button class="button danger" id="btnStop" hidden>停止</button>
        </div>
        <div class="sidebar-meta"><span>今日发送</span><strong id="sidebarTotal">0</strong></div>
      </div>
    </aside>
    <main class="main-content">{% block content %}{% endblock %}</main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/static/js/app.js"></script>
</body>
</html>
